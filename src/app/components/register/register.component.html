<div class="auth-container">
  <div class="auth-card">
    <div class="logo">💰</div>
    <h2>Create Account</h2>
    <p class="subtitle">Start tracking your finances</p>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="form.name" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="form.email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="form.password" placeholder="••••••••">
    </div>
    <button class="btn-primary" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Create Account' }}
    </button>
    <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
