<div class="auth-container">
  <div class="auth-card">
    <div class="logo">💰</div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to FinTrack</p>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="form.email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="form.password" placeholder="••••••••">
    </div>
    <button class="btn-primary" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>
    <p class="switch-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
