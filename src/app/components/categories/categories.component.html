<div class="app-layout">

  <app-sidebar></app-sidebar>

  <main class="main-content">

    <div class="page-header">
      <div>
        <h1>Categories</h1>
        <p>Organize your income and expenses</p>
      </div>

      <button class="btn-add" (click)="openForm()">
        <i class="ti ti-plus"></i> Add category
      </button>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" *ngIf="showForm">
      <div class="modal">

        <div class="modal-header">
          <h3>{{ editingId ? 'Edit category' : 'New category' }}</h3>

          <button class="modal-close" (click)="showForm = false">
            <i class="ti ti-x"></i>
          </button>
        </div>

        <div class="modal-body">

          <div class="form-field">
            <label>Name</label>

            <input
              type="text"
              [(ngModel)]="form.name"
              placeholder="e.g. Salary"
            >
          </div>

          <div class="form-field">
            <label>Type</label>

            <select [(ngModel)]="form.type">
              <option value="INCOME">Income</option>
              <option value="EXPENSE">Expense</option>
            </select>
          </div>

        </div>

        <div class="modal-footer">

          <button class="btn-cancel" (click)="showForm = false">
            Cancel
          </button>

          <button class="btn-save" (click)="save()">
            {{ editingId ? 'Update' : 'Save' }}
          </button>

        </div>

      </div>
    </div>

    <!-- Categories Grid -->
    <div class="categories-grid">

      <!-- Income -->
      <div class="cat-section">

        <div class="section-label income-label">
          <i class="ti ti-arrow-up-right"></i>
          Income
        </div>

        <div
          class="empty-section"
          *ngIf="incomeCategories().length === 0"
        >
          No income categories yet
        </div>

        <div class="cat-list">

          <div
            class="cat-item"
            *ngFor="let c of incomeCategories()"
          >

            <div class="cat-dot income"></div>

            <span class="cat-name">
              {{ c.name }}
            </span>

            <div class="cat-actions">

              <button class="icon-btn" (click)="edit(c)">
                <i class="ti ti-edit"></i>
              </button>

              <button class="icon-btn danger" (click)="delete(c.id)">
                <i class="ti ti-trash"></i>
              </button>

            </div>

          </div>

        </div>

      </div>

      <!-- Expense -->
      <div class="cat-section">

        <div class="section-label expense-label">
          <i class="ti ti-arrow-down-right"></i>
          Expense
        </div>

        <div
          class="empty-section"
          *ngIf="expenseCategories().length === 0"
        >
          No expense categories yet
        </div>

        <div class="cat-list">

          <div
            class="cat-item"
            *ngFor="let c of expenseCategories()"
          >

            <div class="cat-dot expense"></div>

            <span class="cat-name">
              {{ c.name }}
            </span>

            <div class="cat-actions">

              <button class="icon-btn" (click)="edit(c)">
                <i class="ti ti-edit"></i>
              </button>

              <button class="icon-btn danger" (click)="delete(c.id)">
                <i class="ti ti-trash"></i>
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>
